<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Via Direta - Recolhas</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f3f4f6;color:#111827}
.wrap{max-width:620px;margin:auto;padding:16px}
h1{margin:4px 0 2px;font-size:26px}.sub{color:#6b7280;margin-bottom:16px}
.card{background:#fff;padding:14px;border-radius:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
label{display:block;font-size:13px;font-weight:700;margin:8px 0 6px}
input,button{width:100%;box-sizing:border-box;padding:13px;font-size:17px;border-radius:9px;border:1px solid #d1d5db}
button{margin-top:10px;border:0;background:#166534;color:#fff;font-weight:700}
.type-wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.type-btn{background:#e5e7eb;color:#111827;border:2px solid transparent}
.type-btn.active{background:#166534;color:#fff;border-color:#14532d}
.start{background:#0f766e}
.stop{background:#991b1b}
#reader{overflow:hidden;border-radius:12px;background:#000}
#status{display:none;margin-top:12px;padding:14px;border-radius:10px;font-size:18px;font-weight:700;text-align:center}
.ok{display:block!important;background:#dcfce7;color:#166534}.dup{display:block!important;background:#fef3c7;color:#92400e}
.err{display:block!important;background:#fee2e2;color:#991b1b}.info{display:block!important;background:#dbeafe;color:#1e40af}
.last{font-size:20px;font-weight:700;word-break:break-word}.count{font-size:14px;color:#6b7280;margin-top:5px}
</style>
</head>
<body>
<div class="wrap">
<h1>Via Direta</h1><div class="sub">Recolhas e devoluções</div>

<div class="card">
<label for="estafeta">Estafeta</label>
<input id="estafeta" type="text" placeholder="Ex.: João" autocomplete="name">

<label>Tipo</label>
<div class="type-wrap">
  <button id="btnRecolha" class="type-btn" type="button" onclick="selectType('Recolha')">📦 RECOLHA</button>
  <button id="btnDevolucao" class="type-btn" type="button" onclick="selectType('Devolução')">↩️ DEVOLUÇÃO</button>
</div>

<button id="startBtn" class="start" onclick="startScanner()">📷 INICIAR SCANNER</button>
<button id="stopBtn" class="stop" onclick="stopScanner()" style="display:none">⏹ PARAR SCANNER</button>
</div>

<div class="card"><div id="reader"></div><div id="status"></div></div>

<div class="card">
<div>Último código:</div><div class="last" id="lastCode">—</div>
<div class="count">Registados nesta sessão: <span id="count">0</span></div>
</div>
</div>

<script>
const BACKEND = "https://script.google.com/macros/s/AKfycbxw3WeiyBQWvlZjGacCAQHVfrSgX1ychKz7wfkqPeoWQfpDwUF9vg65coiasFAW0ToLqw/exec";
let scanner=null,busy=false,count=0,lastSent="",lastSentAt=0,selectedType="";

const estafetaInput=document.getElementById("estafeta");
const savedDriver=localStorage.getItem("vd_estafeta");
if(savedDriver) estafetaInput.value=savedDriver;
estafetaInput.addEventListener("change",()=>localStorage.setItem("vd_estafeta",estafetaInput.value.trim()));

function showStatus(msg,cls){
  const el=document.getElementById("status");
  el.className=cls;
  el.textContent=msg;
}

function selectType(type){
  selectedType=type;
  document.getElementById("btnRecolha").classList.toggle("active", type==="Recolha");
  document.getElementById("btnDevolucao").classList.toggle("active", type==="Devolução");
  showStatus("Tipo selecionado: "+type,"info");
}

async function startScanner(){
 const estafeta=estafetaInput.value.trim();
 if(!estafeta){
   showStatus("Escreve primeiro o nome do estafeta.","err");
   estafetaInput.focus();
   return;
 }
 if(!selectedType){
   showStatus("Escolhe primeiro RECOLHA ou DEVOLUÇÃO.","err");
   return;
 }

 localStorage.setItem("vd_estafeta",estafeta);
 if(scanner) return;
 scanner=new Html5Qrcode("reader");

 try{
  await scanner.start(
    {facingMode:"environment"},
    {fps:12,qrbox:{width:300,height:160},experimentalFeatures:{useBarCodeDetectorIfSupported:true}},
    onScanSuccess,
    ()=>{}
  );
  document.getElementById("startBtn").style.display="none";
  document.getElementById("stopBtn").style.display="block";
  showStatus("Scanner ativo — "+selectedType+".","info");
 }catch(e){
  console.error(e);
  showStatus("Não foi possível abrir a câmara. Confirma a permissão da câmara no Chrome.","err");
  scanner=null;
 }
}

async function stopScanner(){
 if(!scanner) return;
 try{await scanner.stop();await scanner.clear();}catch(e){}
 scanner=null;
 document.getElementById("startBtn").style.display="block";
 document.getElementById("stopBtn").style.display="none";
 showStatus("Scanner parado.","info");
}

function onScanSuccess(decodedText){
 const code=String(decodedText||"").trim();
 if(!code||busy) return;
 const now=Date.now();
 if(code===lastSent && (now-lastSentAt)<3000) return;

 busy=true;
 lastSent=code;
 lastSentAt=now;

 if(navigator.vibrate) navigator.vibrate(80);
 document.getElementById("lastCode").textContent=code;
 showStatus("A guardar "+code+"...","info");
 sendToSheet(code);
}

function sendToSheet(code){
 const estafeta=estafetaInput.value.trim();
 const tipo=selectedType;
 const callbackName="vdCallback_"+Date.now()+"_"+Math.floor(Math.random()*100000);

 window[callbackName]=function(result){
  const script=document.getElementById(callbackName);
  try{delete window[callbackName];}catch(e){}
  if(script&&script.parentNode)script.parentNode.removeChild(script);

  if(result&&result.sucesso){
    count++;
    document.getElementById("count").textContent=count;
    showStatus("✓ "+code+" registado como "+tipo,"ok");
  }else if(result&&result.duplicado){
    showStatus("⚠ "+code+" já estava registado","dup");
  }else{
    showStatus(result&&result.mensagem?result.mensagem:"Erro ao guardar.","err");
  }

  setTimeout(()=>{busy=false;},900);
 };

 const url=BACKEND
  +"?referencia="+encodeURIComponent(code)
  +"&estafeta="+encodeURIComponent(estafeta)
  +"&tipo="+encodeURIComponent(tipo)
  +"&callback="+encodeURIComponent(callbackName);

 const script=document.createElement("script");
 script.id=callbackName;
 script.src=url;
 script.onerror=function(){
   showStatus("Erro de ligação. Confirma a internet e tenta novamente.","err");
   busy=false;
 };
 document.body.appendChild(script);
}
</script>
</body>
</html>
